name: Release

# A push to main releases the APK only when the app's version goes up. The
# version is versionName in app/build.gradle.kts: bump it (1.1.2 -> 1.1.3)
# and the merge publishes release v1.1.3. Pushes that keep the same version,
# or a lower one, don't release anything.
#
#   push to main, version 1.1.3 is new  -> release v1.1.3
#   push to main, v1.1.3 already out    -> nothing
#   push tag v0.2.0                     -> release v0.2.0
#
# versionCode is this workflow's run number, so it only goes up and every
# release installs over the previous one.
#
# Signing: add these repository secrets to get a signed release APK
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release gets a debug-signed APK. Each CI run has a
# different debug key, so those can't update each other: uninstall first.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, to find the last version tag
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/.*gradleProperty("versionName").getOrElse("\([^"]*\)").*/\1/p' app/build.gradle.kts)
            if [ -z "$version" ]; then
              echo "::error::Couldn't read versionName from app/build.gradle.kts"
              exit 1
            fi
            tag="v$version"
            # The highest version already released, leaving out the old -build.N ones
            latest=$(git tag -l 'v[0-9]*' | grep -v -- '-build\.' | sort -V | tail -n 1)
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag is already released, nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
              echo "$tag is older than $latest, nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "TITLE=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.release == 'true'

      - name: Decode keystore
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        if: steps.version.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args="-PversionName=$VERSION -PversionCode=$GITHUB_RUN_NUMBER"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew testReleaseUnitTest assembleRelease $args
            cp app/build/outputs/apk/release/app-release.apk "astika-kastorias-$VERSION.apk"
          else
            echo "::warning::No signing secrets set, publishing a debug-signed APK"
            ./gradlew testDebugUnitTest assembleDebug $args
            cp app/build/outputs/apk/debug/app-debug.apk "astika-kastorias-$VERSION-debug.apk"
          fi

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" astika-kastorias-*.apk \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes \
            --latest
