name: Release

# Push a tag like v0.2.0 to build the APK and publish it as a GitHub release.
#
# Signing: add these repository secrets to get a signed release APK
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release gets the debug-signed APK instead, which installs
# fine for testing but can't be updated by a later signed build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          args="-PversionName=$version -PversionCode=${{ github.run_number }}"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew testReleaseUnitTest assembleRelease $args
            cp app/build/outputs/apk/release/app-release.apk "astika-kastorias-$version.apk"
          else
            echo "::warning::No signing secrets set, publishing the debug-signed APK"
            ./gradlew testDebugUnitTest assembleDebug $args
            cp app/build/outputs/apk/debug/app-debug.apk "astika-kastorias-$version-debug.apk"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" astika-kastorias-*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
