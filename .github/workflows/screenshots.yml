name: Screenshots

# Takes screenshots of the main screens on an Android emulator (scripts/screenshots.sh)
# and attaches them to the run (Artifacts, "screenshots"), for seeing a change without
# a phone at hand. Run it from the Actions tab; it also runs on pull requests that
# change this workflow or the script.
#
# On main it runs when the screens or the texts change, and puts the new screenshots
# in docs/screenshots, the ones the README and the organisation's site show, so they
# follow the app. Same file names every time, so links to them keep working.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/screenshots.yml
      - scripts/screenshots.sh
  push:
    branches: [main]
    paths:
      - app/src/main/java/com/kastoriadevs/astikoktel/app/ui/**
      - app/src/main/res/**
      - app/src/main/assets/**
      - .github/workflows/screenshots.yml
      - scripts/screenshots.sh

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Update docs/screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          # 430 px wide is plenty for a page, and keeps the repo small
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for f in sorted(Path("screenshots").glob("*.png")):
              im = Image.open(f).convert("RGB")
              im = im.resize((430, round(im.height * 430 / im.width)), Image.LANCZOS)
              im.save(Path("docs/screenshots") / f.name, optimize=True)
          PY
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "The screenshots haven't changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the screenshots"
          git pull --rebase -q origin main
          git push origin HEAD:main
